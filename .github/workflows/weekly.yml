name: weekly-history
on:
  schedule:
    - cron: "0 3 * * 6"  # sobota 03:00 UTC: gleboki backfill historii cen
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    env:
      TOP_N_HISTORY: "600"   # szerszy krag itemow
      HISTORY_DAYS: "90"     # 90 dni wstecz (API pozwala: start_days_ago)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_market.py
      - run: python scripts/fetch_orderbook.py --full
      - run: python scripts/build_gold.py
      - run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add config.yaml data docs
          git diff --quiet && git diff --staged --quiet || (git commit -m "nevia weekly history backfill" && git push)
