name: weekly-history
on:
  schedule:
    - cron: "0 3 * * 6"  # sobota 03:00 UTC: gleboki backfill historii cen
  workflow_dispatch:
permissions:
  contents: write
# Ta sama grupa co daily-nevia. cancel-in-progress: false — sobotni backfill
# (kilka godzin) nie jest ubijany, gdy o 05:00 wystartuje daily. Daily czeka
# i robi checkout juz po pushu weekly. git_publish i tak dogrywa commit, gdy
# main ruszy sie z innego powodu.
concurrency:
  group: nevia-data-publish
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    env:
      TOP_N_HISTORY: "600"   # szerszy krag itemow
      HISTORY_DAYS: "90"     # 90 dni wstecz (API pozwala: start_days_ago)
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_market.py
      - run: python scripts/fetch_orderbook.py --full
      - run: python scripts/build_gold.py
      - run: python scripts/git_publish.py --message "nevia weekly history backfill"
      - name: stage fetched data for artifact
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/weekly-backup"
          [ -d data/gold ] && cp -a data/gold "$RUNNER_TEMP/weekly-backup/gold"
          [ -d docs/data ] && cp -a docs/data "$RUNNER_TEMP/weekly-backup/docs-data"
          day=$(date -u +%F)
          if [ -d "data/raw/$day" ]; then
            mkdir -p "$RUNNER_TEMP/weekly-backup/raw"
            cp -a "data/raw/$day" "$RUNNER_TEMP/weekly-backup/raw/$day"
          fi
      - name: keep fetched data if publish failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-history-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/weekly-backup
