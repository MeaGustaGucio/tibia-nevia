name: daily-nevia
on:
  schedule:
    - cron: "0 5 * * *"  # <-- CZESTOTLIWOSC: zmien tutaj, np. "0 5,17 * * *" = 2x dziennie
  workflow_dispatch:
permissions:
  contents: write
# Wspolna grupa z weekly-history (patrz weekly.yml). Daily nie jest anulowany:
# w sobote, jesli backfill jeszcze idzie, ten workflow czeka i startuje po nim.
concurrency:
  group: nevia-data-publish
  cancel-in-progress: false
jobs:
  etl:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Wszystko sterowane przez config.yaml (brackety, voc, recent_days, top_n).
      - run: python scripts/fetch_tibiadata.py
      - run: python scripts/fetch_market.py
      - run: python scripts/fetch_hunts.py
      - run: python scripts/fetch_creatures.py
      - run: python scripts/fetch_tibia_events.py
      - run: python scripts/fetch_orderbook.py
      - run: python scripts/build_gold.py
      # Opcjonalny upload do R2: odkomentuj po dodaniu secretow R2_* (s3cmd/rclone).
      # - run: echo "R2 upload placeholder"
      - run: python scripts/git_publish.py --message "nevia daily snapshot"
