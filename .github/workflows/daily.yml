name: daily-nevia
on:
  schedule:
    - cron: "0 5 * * *"  # <-- CZESTOTLIWOSC: zmien tutaj, np. "0 5,17 * * *" = 2x dziennie
  workflow_dispatch:
permissions:
  contents: write
jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tibia-nevia-pipeline/requirements.txt
      - run: pip install -r tibia-nevia-pipeline/requirements.txt
      # Wszystko sterowane przez config.yaml (brackety, voc, recent_days, top_n).
      - run: python scripts/fetch_tibiadata.py
        working-directory: tibia-nevia-pipeline
      - run: python scripts/fetch_market.py
        working-directory: tibia-nevia-pipeline
      - run: python scripts/fetch_hunts.py
        working-directory: tibia-nevia-pipeline
      - run: python scripts/build_gold.py
        working-directory: tibia-nevia-pipeline
      # Opcjonalny upload do R2: odkomentuj po dodaniu secretow R2_* (s3cmd/rclone).
      # - run: echo "R2 upload placeholder"
      - run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add config.yaml data docs
          git diff --quiet && git diff --staged --quiet || (git commit -m "nevia daily snapshot" && git push)
        working-directory: tibia-nevia-pipeline
