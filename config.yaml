# ============ TIBIA NEVIA PIPELINE — KONFIGURACJA ============
# To jest jedyne miejsce, w ktorym zmieniasz zakres/czestotliwosc/zrodla.
# Wszystkie skrypty czytaja ten plik (CLI nadpisuje config, patrz README).
# Po zmianie zacommituj i zpushuj — Actions wezmie nowy config w kolejnym runie.

world: Nevia  # serwer opcjonalnie PvP, staly

# ---- HUNTY (hunt-analyser.com, publiczne sesje) ----
hunts:
  # Brackety levelowe. Kazdy dokleja wyniki do hunts.csv z danego dnia.
  # vocations: [] = wszystkie (filtry voc sumuja sie OR; voc i tak laduje w kolumnie
  # party_comp, a wieksza probka = lepsze mediany). party: Solo / Duo / x3 / x4 / x5 / x6+
  brackets:
    - { min: 50,  max: 100, vocations: [], party: [Solo], pages: 5 }
    - { min: 100, max: 200, vocations: [], party: [Solo], pages: 5 }
    - { min: 200, max: 300, vocations: [], party: [Solo], pages: 5 }
  # Duo na niskich lvlach prawie nie istnieje w publicznych danych (zweryfikowane:
  # duo 100-130 = 0, duo 80-150 = 1/strone), wiec duo ZAWSZE idzie z szerszego
  # zakresu i bez filtra voc — sklad ED+EK filtrujesz potem po kolumnie party_comp.
  duo: { min: 50, max: 300, vocations: [], party: [Duo], pages: 3 }

# ---- CENY (api.tibiamarket.top) ----
market:
  top_n_history: 150  # historia 30-90d dla top-N (szybki dzienny odswiezacz)
  history_days: 90    # glebokosc historii (start_days_ago; API pozwala wiecej)
  full_history_weekly: true  # osobny job sobotni dobiera historie dla WSZYSTKICH itemow (porcjami, resume)

# ---- DRABINKA OFERT (market_board: pelny rozklad cen + sztuki) ----
orderbook:
  watchlist: ["rope belt"]  # zawsze sciagane (Twoje itemy), nazwy jak na Wiki/market
  max_items: 300            # limit drabinek/dzien: watchlista + loot z faktycznych killi
  # items = watchlista + unia loot_list potworow z hunt_kills (PAYLOAD: ~300 x 5 KB/dzien)

# ---- LOGI SESJI (Wasze dokladne county: data/manual/sessions/*.csv) ----
sessions:
  schema: "spawn,date,minutes,item,count,note"
  # przyklad: Cults Yalahar,2026-09-16,68,rope belt,11,wieczorny hunt z bratem

# ---- RANKINGI (build_gold.py) ----
gold:
  # DWA odciecia, bo nerf golda 07.09.2026 psuje PROFIT starych huntow, ale nie EXP:
  recent_days_profit: 60   # profit/h tylko ze swiezych huntow (nerf golda!)
  recent_days_exp: 365      # exp/h jest stabilne w czasie, wieksza probka = lepsza mediana
  brackets: ["50-100", "100-200", "200-300"]  # pliki ranking_exp_<bracket>.csv itd.

# ---- CZESTOTLIWOSC ----
# Zmienia sie NIE tutaj tylko w .github/workflows/daily.yml, linia: cron: "0 5 * * *"
# (GitHub Actions nie czyta crona z pliku — przyklad: "0 5,17 * * *" = 2x dziennie,
#  "0 5 * * 1" = tylko w poniedzialki. Format: minuta godzina dzien-miesiaca miesiac dzien-tygodnia, UTC.)
